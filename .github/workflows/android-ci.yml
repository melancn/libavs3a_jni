# Template for the SEPARATE <owner>/libavs3a_jni repository.
# This is NOT a MediaHub workflow and references tasks/scripts to implement there.
# Before production use, pin reviewed action commit SHAs instead of major tags.
# Deliberately builds bridge-only: NO third-party decoder/model or secret access.
name: Android JNI bridge CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avs3a-jni-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_COMPILE_SDK: '36'
      ANDROID_MIN_SDK: '24'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      SDK_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check repository toolchain locks
        shell: bash
        run: python3 ci/verify-wrapper-and-locks.py

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          test -x "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          java -version
          ./gradlew --version

      - name: Host parser and state tests (no ARM SDK execution)
        shell: bash
        run: |
          set -euo pipefail
          CMAKE="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin/cmake"
          CTEST="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin/ctest"
          "$CMAKE" -S native -B build/host -DAVS3A_BUILD_HOST_TESTS=ON
          "$CMAKE" --build build/host --parallel 2
          "$CTEST" --test-dir build/host --output-on-failure

      - name: Build bridge AAR with both Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          # sdk/build.gradle.kts must use both ABI filters, the pinned versions,
          # and keep src/full vendor resources out of bridgeRelease.
          ./gradlew --no-daemon \
            :sdk:testBridgeDebugUnitTest \
            :sdk:assembleBridgeRelease \
            :sdk:publishBridgeReleasePublicationToCiRepository \
            -PsdkVersion="$SDK_VERSION" \
            -PsourceCommit="$GITHUB_SHA" \
            -PandroidNdkVersion="$ANDROID_NDK_VERSION" \
            -PandroidCmakeVersion="$ANDROID_CMAKE_VERSION"

      - name: Verify packaging and produce locked distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify-aar.py \
            --aar sdk/build/outputs/aar/sdk-bridge-release.aar \
            --distribution bridge \
            --expected-abis arm64-v8a armeabi-v7a \
            --ndk "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          python3 ci/make-ci-dist.py \
            --aar sdk/build/outputs/aar/sdk-bridge-release.aar \
            --maven-dir build/ci-maven \
            --version "$SDK_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --distribution bridge \
            --output dist
          # verify-aar MUST reject libavs3a_decoder.so and model.bin here.
          # Neither script may mark ARM decoding tests passed from host compilation.

      - name: Upload bridge-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avs3a-bridge-${{ env.SDK_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
