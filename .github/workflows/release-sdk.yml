name: Release SDK and Media3 demo (full)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdkVersion:
        description: 'SDK version (e.g. 0.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      ANDROID_COMPILE_SDK: '36'
      ANDROID_MIN_SDK: '24'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve SDK version
        shell: bash
        env:
          REQUESTED_SDK_VERSION: ${{ inputs.sdkVersion }}
        run: |
          set -euo pipefail
          ver="${REQUESTED_SDK_VERSION:-$GITHUB_REF_NAME}"
          ver="${ver#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)*$ ]] || { echo "Invalid SDK version" >&2; exit 1; }
          echo "SDK_VERSION=$ver" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify toolchain locks
        shell: bash
        run: |
          python3 ci/verify-wrapper-and-locks.py
          python3 -m unittest discover -s ci/tests -v

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found" >&2
            ls -la "$ANDROID_HOME/cmdline-tools/" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          java -version
          ./gradlew --version

      - name: Host C++ tests
        shell: bash
        run: |
          set -euo pipefail
          CMAKE="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin/cmake"
          CTEST="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin/ctest"
          "$CMAKE" -S native -B build/host -DAVS3A_BUILD_HOST_TESTS=ON
          "$CMAKE" --build build/host --parallel 2
          "$CTEST" --test-dir build/host --output-on-failure

      - name: Stage vendor inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify-vendor-inputs.py \
            --lock vendor/manifest.lock.json \
            --input-root vendor-inputs \
            --stage-root .

      - name: Build full AAR and installable demo APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :sdk:testFullDebugUnitTest \
            :sdk:assembleFullRelease \
            :sdk:publishFullReleasePublicationToCiRepository \
            :media3-demo:testBridgeDebugUnitTest \
            :media3-demo:assembleBridgeDebug \
            :media3-demo:assembleFullDebug \
            -PdemoVersionCode="$GITHUB_RUN_NUMBER" \
            -PsdkVersion="$SDK_VERSION" \
            -PsourceCommit="$GITHUB_SHA" \
            -PandroidNdkVersion="$ANDROID_NDK_VERSION" \
            -PandroidCmakeVersion="$ANDROID_CMAKE_VERSION"

      - name: Verify full AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify-aar.py \
            --aar sdk/build/outputs/aar/sdk-full-release.aar \
            --distribution full \
            --expected-abis arm64-v8a armeabi-v7a \
            --ndk "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

      - name: Produce distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/make-ci-dist.py \
            --aar sdk/build/outputs/aar/sdk-full-release.aar \
            --maven-dir build/ci-maven \
            --version "$SDK_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --distribution full \
            --output dist

      # Debug APKs are deliberately used for direct installation; no release key is assumed.
      # The full APK contains the same locked vendor/model as the full AAR.
      - name: Verify and package demo APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose media3-demo/build/outputs/apk/bridge/debug/media3-demo-bridge-debug.apk
          "$APKSIGNER" verify --verbose media3-demo/build/outputs/apk/full/debug/media3-demo-full-debug.apk
          python3 ci/package-demo-apks.py \
            --bridge media3-demo/build/outputs/apk/bridge/debug/media3-demo-bridge-debug.apk \
            --full media3-demo/build/outputs/apk/full/debug/media3-demo-full-debug.apk \
            --version "$SDK_VERSION" \
            --lock vendor/manifest.lock.json \
            --dist dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Verify device evidence (if reports provided)
        shell: bash
        continue-on-error: true
        run: |
          if [ -f private-validation/devices/arm64-v8a/report.json ] && \
             [ -f private-validation/devices/armeabi-v7a/report.json ]; then
            python3 ci/verify-device-evidence.py \
              --aar sdk/build/outputs/aar/sdk-full-release.aar \
              --manifest dist/sdk-manifest.json \
              --device-report private-validation/devices \
              --fixture-manifest private-validation/fixture-manifest.json
          else
            echo "Device reports not provided; device validation remains NOT_RUN"
          fi

      - name: Upload full artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avs3a-full-${{ env.SDK_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-full
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve SDK version
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)*$ ]] || exit 1
          echo "SDK_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: avs3a-full-${{ env.SDK_VERSION }}
          path: dist

      - name: Check vendor redistribution authorization before public release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("vendor/manifest.lock.json").read_text(encoding="utf-8-sig"))
          if lock.get("redistributionApproved") is not True:
              raise SystemExit("Full AAR/APK redistribution is not approved; artifacts remain CI-only, no GitHub Release is created.")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
